<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BANR Super Admin</title><link rel="stylesheet" href="../app.css">
<style>
.admin { max-width: 960px; margin: auto; padding: 20px; }
.admin header { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-bottom:20px; }
.admin textarea { width:100%; min-height:80px; padding:10px; font:inherit; border-radius:12px; }
.admin details { padding:12px; } .admin summary { cursor:pointer; font-weight:700; }
.admin .items { margin-block:12px; } .admin fieldset { min-width:0; padding:12px; border:1px solid #a9c8ba; border-radius:12px; }
.admin legend { padding-inline:6px; } .admin a { overflow-wrap:anywhere; }
</style></head>
<body><main class="admin">
<header><h1>BANR Super Admin</h1><button id="sign-out" type="button" class="primary" hidden>Sign Out</button></header>
<p id="error" role="alert"></p><p id="status" role="status"></p><section id="screen" class="stack"></section>
<script type="module" src="./admin.js"></script></main></body></html>
