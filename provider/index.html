<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#064b36">
  <title>BANR Provider Portal</title>
  <link rel="stylesheet" href="../app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&amp;display=swap">
  <style>
    body.provider-page{font-family:Poppins,Arial,sans-serif}
    .provider-page .app{max-width:1440px}
    .provider-page .top{display:block;text-align:left;padding:24px clamp(18px,4vw,48px) 12px}
    .provider-page main{padding:16px clamp(18px,4vw,48px) 48px}
    .provider-page .panel{min-width:0;margin:0}
    .provider-page .raised{border-radius:18px;border:1px solid #e9f8ef;background:linear-gradient(145deg,#e6f6ed,#d2eadd);box-shadow:inset 1px 1px 2px #ffffffa6,7px 8px 18px #416e5c36,-5px -5px 14px #f6fffa9c}
    .provider-page .field :is(input,select){min-height:44px;min-width:0;background:#ddf0e7;box-shadow:inset 3px 3px 7px #416e5c26,inset -3px -3px 7px #ffffffad}
    .provider-page button{min-height:44px}
    .provider-page .primary:active{transform:translateY(1px);box-shadow:inset 2px 3px 7px #102b2266}
    .provider-page [hidden]{display:none!important}
    .provider-page #provider-screen{display:grid;gap:16px;align-items:start}
    .provider-page #provider-screen > .chips{flex-wrap:wrap}
    @media(min-width:1000px){
      .provider-page .app{zoom:1.06;min-height:calc(100dvh / 1.06)}
      .provider-page #provider-screen{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
      .provider-page #provider-screen > :is(.chips,.pagehead,.chips + section){grid-column:1/-1}
      .provider-page #provider-screen > .chips + section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
      .provider-page #provider-screen:has([data-form="login"]) > .pagehead{grid-column:1}
      .provider-page [data-form="login"]{grid-column:2}
      .provider-page #provider-walkin{grid-column:2;grid-row:4/span 2}
    }
    @media(min-width:1000px){
      .provider-page .app:has([data-action="settings"]){max-width:1600px}
      .provider-page .app:has([data-action="settings"]) .top{padding-block:16px 6px}
      .provider-page main:has([data-action="settings"]){padding:10px clamp(18px,3vw,36px) 28px}
      .provider-page #provider-screen:has([data-action="settings"]){gap:12px}
      .provider-page #provider-screen:has([data-action="settings"]) > .pagehead{margin:0;font-size:28px}
      .provider-page #provider-screen > :is(.panel,#provider-queue){padding:16px}
      .provider-page #provider-screen > :is(form,section) .field{margin:0}
      .provider-page #provider-screen > :is(#provider-walkin,[data-form="facility"],[data-form="doctor"],[data-form="session"]){display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
      .provider-page #provider-screen > :is(#provider-walkin,[data-form="facility"],[data-form="doctor"],[data-form="session"]) > :is(h2,button){grid-column:1/-1}
      .provider-page #provider-screen > #provider-queue,.provider-page #provider-screen > #provider-late{grid-column:1}
      .provider-page #provider-screen > #provider-queue{grid-row:4}
      .provider-page #provider-screen > #provider-late{grid-row:5}
      .provider-page #provider-screen:has([data-form="facility"]) > button[data-action="delete-doctor"]{justify-self:start;align-self:center}
    }
    @media(min-width:1200px){
      .provider-page #provider-screen:has([data-form="facility"]){grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    .provider-page .queue-actions,.provider-page .queue-advance{display:grid;gap:10px}
    .provider-page .queue-advance{grid-template-columns:repeat(2,minmax(0,1fr))}
    .provider-page .queue-actions button{width:100%;min-height:54px}
    .provider-page .queue-actions button:disabled{opacity:.55}
    @media(max-width:600px){
      .provider-page .app{width:100%;max-width:none;margin:0;border-radius:0;min-height:100dvh}
      .provider-page .field :is(input,select){font-size:16px}
    }
  </style>
</head>
<body class="provider-page">
  <div class="app">
    <header class="top"><span></span><div><div class="brand">BANR</div><div class="subtitle">Provider Portal</div></div></header>
    <main id="provider">
      <p role="alert" class="err" id="provider-error"></p>
      <p role="status" id="provider-status"></p>
      <p id="staff-notice" class="panel raised" hidden></p>
      <div id="provider-screen"></div>
    </main>
  </div>
  <script type="module" src="./portal.js"></script>
</body>
</html>
